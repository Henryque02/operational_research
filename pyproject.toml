[project]
name = "operational-research"
version = "1.0.0"
description = "Linear programming and optimization problems solved with AMPL (amplpy) and a from-scratch Simplex implementation — coursework portfolio from Operations Research at UFG."
readme = "README.md"
authors = [{ name = "Henryque" }]
requires-python = ">=3.12"
dependencies = [
    "ampl-module-base>=20260520",
    "ampl-module-cbc>=20251121",
    "ampl-module-highs>=20260611",
    "amplpy>=0.15.2",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operational_research"]

[[tool.uv.index]]
name = "ampl"
url = "https://pypi.ampl.com"
explicit = true

[tool.uv.sources]
ampl-module-base = { index = "ampl" }
ampl-module-cbc = { index = "ampl" }
ampl-module-highs = { index = "ampl" }
